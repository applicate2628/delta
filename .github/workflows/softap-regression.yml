name: SoftAP regression

on:
  push:
    branches: [fix/preserve-softap-configuration]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: softap-regression-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'applicate2628/delta'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Check Kotlin formatting
        run: |
          if ! ./gradlew --no-daemon :data:spotlessKotlinCheck; then
            ./gradlew --no-daemon :data:spotlessKotlinApply
            git diff -- data/src
            exit 1
          fi
      - name: Regression tests
        run: ./gradlew --no-daemon :data:testDebugUnitTest --tests '*SoftApConfigurationPreservationTest'
      - name: All unit tests and debug APK
        run: ./gradlew --no-daemon test :app:assembleDebugKeySignedDebug
      - name: Test summary
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET
          for path in sorted(glob.glob('**/build/test-results/**/*.xml', recursive=True)):
              root = ET.parse(path).getroot()
              print(path, {k: root.get(k) for k in ('tests', 'failures', 'errors', 'skipped')})
              for case in root.findall('testcase'):
                  for failure in case.findall('failure'):
                      print(case.get('name'), (failure.get('message') or '')[:800])
          PY
