name: SoftAP regression

on:
  workflow_dispatch:
    inputs:
      baseline_only:
        description: Run regression tests without packaging
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: softap-regression-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'applicate2628/delta'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Regression tests
        run: ./gradlew --no-daemon test
      - name: All unit tests and debug APK
        if: ${{ !inputs.baseline_only }}
        run: ./gradlew --no-daemon test :app:assembleDebugKeySignedDebug
      - name: Check formatting
        if: ${{ !inputs.baseline_only }}
        run: ./gradlew --no-daemon spotlessCheck
      - name: Upload debug APK
        if: ${{ !inputs.baseline_only && success() }}
        uses: actions/upload-artifact@v4
        with:
          name: delta-preserve-wifi6-debug-${{ github.sha }}
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Test summary
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET
          for path in sorted(glob.glob('**/build/test-results/**/*.xml', recursive=True)):
              root = ET.parse(path).getroot()
              print(path, {k: root.get(k) for k in ('tests', 'failures', 'errors', 'skipped')})
              for case in root.findall('testcase'):
                  for failure in case.findall('failure'):
                      print(case.get('name'), (failure.get('message') or '')[:800])
          PY
      - name: Formatting patch on failure
        if: ${{ failure() && !inputs.baseline_only }}
        run: |
          ./gradlew --no-daemon spotlessApply
          git diff > formatting.patch
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ github.sha }}
          path: |
            **/build/test-results/**/*.xml
            formatting.patch
          retention-days: 7
