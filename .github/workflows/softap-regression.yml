name: SoftAP regression

on:
  workflow_dispatch:
    inputs:
      baseline_only:
        description: Run regression tests without packaging
        type: boolean
        default: false
      release:
        description: Build the unsigned personal release instead of the debug APK
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: softap-regression-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'applicate2628/delta'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Regression tests
        run: ./gradlew --no-daemon test
      - name: Build APK
        if: ${{ !inputs.baseline_only }}
        env:
          BUILD_RELEASE: ${{ inputs.release }}
        run: |
          if [ "$BUILD_RELEASE" = "true" ]; then
            ./gradlew --no-daemon :app:assembleForkRelease
          else
            ./gradlew --no-daemon :app:assembleDebugKeySignedDebug
          fi
      - name: Verify release identity and absence of debug tools
        if: ${{ !inputs.baseline_only && inputs.release }}
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/fork/release/app-fork-release-unsigned.apk
          tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "$tools/aapt2" dump badging "$apk" > "$RUNNER_TEMP/delta-badging.txt"
          "$tools/aapt2" dump xmltree "$apk" --file AndroidManifest.xml > "$RUNNER_TEMP/delta-manifest.txt"
          grep -F "package: name='io.github.applicate2628.delta' versionCode='100' versionName='2026.11.03.1'" "$RUNNER_TEMP/delta-badging.txt"
          grep -F "application-label:'Delta'" "$RUNNER_TEMP/delta-badging.txt"
          if grep -q 'application-debuggable' "$RUNNER_TEMP/delta-badging.txt"; then
            echo 'Unexpected debuggable release'; exit 1
          fi
          if grep -Eiq 'leakcanary|LeakActivity|DisplayLeak' "$RUNNER_TEMP/delta-manifest.txt"; then
            echo 'Unexpected leak-analysis launcher'; exit 1
          fi
          ./gradlew --no-daemon :app:dependencies --configuration forkReleaseRuntimeClasspath > "$RUNNER_TEMP/delta-runtime-deps.txt"
          if grep -Eiq 'com.squareup.leakcanary|com.squareup.shark' "$RUNNER_TEMP/delta-runtime-deps.txt"; then
            echo 'Unexpected leak-analysis dependency'; exit 1
          fi
          if "$tools/apksigner" verify "$apk" > "$RUNNER_TEMP/delta-signature.txt" 2>&1; then
            echo 'Unexpected signature: local permanent signing is required'; exit 1
          fi
          "$tools/zipalign" -c -P 16 4 "$apk"
          sha256sum "$apk"
      - name: Check formatting
        if: ${{ !inputs.baseline_only }}
        run: ./gradlew --no-daemon spotlessCheck
      - name: Upload APK
        if: ${{ !inputs.baseline_only && success() }}
        uses: actions/upload-artifact@v4
        with:
          name: delta-${{ inputs.release && 'release-unsigned' || 'debug' }}-${{ github.sha }}
          path: ${{ inputs.release && 'app/build/outputs/apk/fork/release/*-unsigned.apk' || 'app/build/outputs/apk/debugKeySigned/debug/*.apk' }}
          if-no-files-found: error
          retention-days: 7
      - name: Test summary
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET
          for path in sorted(glob.glob('**/build/test-results/**/*.xml', recursive=True)):
              root = ET.parse(path).getroot()
              print(path, {k: root.get(k) for k in ('tests', 'failures', 'errors', 'skipped')})
              for case in root.findall('testcase'):
                  for failure in case.findall('failure'):
                      print(case.get('name'), (failure.get('message') or '')[:800])
          PY
      - name: Formatting patch on failure
        if: ${{ failure() && !inputs.baseline_only }}
        run: |
          ./gradlew --no-daemon spotlessApply
          git diff > formatting.patch
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ github.sha }}
          path: |
            **/build/test-results/**/*.xml
            formatting.patch
          retention-days: 7
